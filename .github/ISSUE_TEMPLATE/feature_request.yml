name: Feature request
description: Suggest a user-facing improvement for Chiku.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials or private repository content."
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What task is difficult today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and safety considerations.
    validations:
      required: true
