name: Documentation issue
description: Report inaccurate, missing, or unclear Chiku documentation.
title: "docs: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private source code, session files, or confidential logs."
  - type: input
    id: page
    attributes:
      label: Documentation location
      description: Link or path to the README, guide, or command reference.
      placeholder: "README.md#developer-workflow"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is inaccurate or missing?
      description: Quote only the minimum public text needed and explain the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected documentation
      description: Describe the behavior or command that should be documented.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Chiku version or commit
      placeholder: "Output of chiku --version or a commit SHA"
    validations:
      required: true
